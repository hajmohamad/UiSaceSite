version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uisace-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/uisace.db
      - JWT_SECRET=uisace-secret-key-change-me-in-production-2026
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - UPLOAD_DIR=/app/uploads
      - BASE_URL=http://localhost:8080
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
