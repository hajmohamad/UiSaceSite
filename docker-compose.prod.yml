services:
  backend:
    image: alpine:3.20
    container_name: uisace-backend
    restart: always
    working_dir: /app
    command: ["/app/server"]
    environment:
      - PORT=8080
      - DB_PATH=/app/data/uisace.db
      - JWT_SECRET=${JWT_SECRET:-uisace-secret-key-change-me-in-production-2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - UPLOAD_DIR=/app/uploads
      - BASE_URL=${BASE_URL:-https://sace.ui.ac.ir}
    volumes:
      - ./backend/server:/app/server:ro
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    networks:
      - uisace-net

  frontend:
    image: nginx:alpine
    container_name: uisace-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./SSL-Linux:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - uisace-net

networks:
  uisace-net:
    driver: bridge
