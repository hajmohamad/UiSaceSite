# تنظیمات Nginx برای دامنه sace.ui.ac.ir با استفاده از گواهی‌های پوشه SSL-Linux

server {
    listen 80;
    listen [::]:80;
    server_name sace.ui.ac.ir;

    # هدایت خودکار تمام ترافیک HTTP به HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sace.ui.ac.ir;

    # گواهی رسمی دانشگاه اصفهان (ترکیب ui.ac.ir.crt و certum-chain)
    ssl_certificate /etc/nginx/ssl/bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/ui.ac.ir.key;

    # تنظیمات امنیتی بهینه SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # حداکثر حجم فایل‌های آپلودی (فیش پرداختی، تصاویر و ...)
    client_max_body_size 50M;

    # فعال‌سازی فشرده‌سازی Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # مسیر فایل‌های بیلد شده فرانت‌اند React
    root /usr/share/nginx/html;
    index index.html;

    # هندل کردن React Router (SPA Routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # پروکسی به بک‌اند Go برای روت‌های API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # فایل‌های آپلود شده
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # هدرهای امنیتی
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
